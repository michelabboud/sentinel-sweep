name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up exact Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8

      - name: Set up exact Chrome
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        with:
          chrome-version: 148.0.7778.178

      - name: Prepare the runner for Chrome and the secret scan
        run: |
          # ubuntu-24.04 runners restrict unprivileged user namespaces via
          # AppArmor, which kills the downloaded Chrome's sandbox at launch
          # (CHROME_EXITED_EARLY). Relax the runner rather than weakening the
          # product's launcher with --no-sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # test-secret-scan.sh requires ripgrep, which the runner image lacks.
          sudo apt-get update -q
          sudo apt-get install -y -q ripgrep
          rg --version | head -1

      - name: Verify mandatory runtimes
        env:
          SENTINEL_E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          test "$(node -p 'process.versions.node')" = "18.20.8"
          test -n "$SENTINEL_E2E_CHROME"
          test -x "$SENTINEL_E2E_CHROME"
          # Chrome's --version emits a trailing space; anchor must tolerate it
          # (verified with od -c on 148.0.7778.178).
          "$SENTINEL_E2E_CHROME" --version \
            | grep -E '^(Google Chrome( for Testing)?|Chromium) 148\.0\.7778\.178[[:space:]]*$'

      - name: Chrome launch smoke (mirrors the runtime's scrubbed environment)
        env:
          SENTINEL_E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # Launches Chrome the way runtime/browser/chrome.mjs does and
          # surfaces stderr + exit code, which CHROME_EXITED_EARLY hides.
          # Three variants bisect the runtime's launch recipe in one run:
          #   full  = the exact runtime argument list
          #   setsid= full + detached session (spawn {detached:true} replica)
          #   min   = the reduced flag set proven alive on 2026-07-31
          smoke() {
            local label="$1"; shift
            local use_setsid="$1"; shift
            local PROFILE; PROFILE="$(mktemp -d "/tmp/.chrome-smoke-${label}-XXXXXX")"
            mkdir -p "$PROFILE/.config" "$PROFILE/.cache" "$PROFILE/.tmp" "$PROFILE/.crash-dumps"
            local RUNNER=(env -i
              HOME="$PROFILE" XDG_CONFIG_HOME="$PROFILE/.config"
              XDG_CACHE_HOME="$PROFILE/.cache" TMPDIR="$PROFILE/.tmp"
              LANG=C.UTF-8 LC_ALL=C.UTF-8 PATH=/usr/bin:/bin)
            [ "$use_setsid" = yes ] && RUNNER+=(setsid)
            set +e
            "${RUNNER[@]}" "$SENTINEL_E2E_CHROME" "$@" \
              --user-data-dir="$PROFILE" \
              --crash-dumps-dir="$PROFILE/.crash-dumps" about:blank \
              > /dev/null 2> "$PROFILE/stderr.log" &
            local CHROME_PID=$!
            sleep 8
            if kill -0 "$CHROME_PID" 2>/dev/null; then
              echo "SMOKE[$label]: ALIVE"
              kill "$CHROME_PID" 2>/dev/null; wait "$CHROME_PID" 2>/dev/null
            else
              wait "$CHROME_PID"; echo "SMOKE[$label]: DIED exit=$?"
              echo "--- stderr[$label] (tail) ---"; tail -25 "$PROFILE/stderr.log" || true
            fi
            set -e
            rm -rf "$PROFILE"
          }
          FULL_ARGS=(--headless=new
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=0
            --no-first-run --no-default-browser-check
            --disable-background-networking --disable-component-update
            --disable-default-apps --disable-extensions --disable-popup-blocking
            --disable-sync --disable-breakpad --disable-crash-reporter
            --noerrdialogs --metrics-recording-only --disable-dev-shm-usage)
          smoke full   no  "${FULL_ARGS[@]}"
          smoke setsid yes "${FULL_ARGS[@]}"
          smoke min    no  --headless=new \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=0 \
            --no-first-run --no-default-browser-check \
            --disable-background-networking --disable-breakpad \
            --disable-crash-reporter --disable-dev-shm-usage

      - name: Runtime launchChrome smoke (standalone vs concurrent)
        env:
          SENTINEL_E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # Bisects harness-vs-runtime: does the runtime's own launcher die
          # standalone, or only when several Chromes race (node --test runs
          # test files concurrently)?
          node --input-type=module - <<'NODE'
          import { launchChrome } from './runtime/browser/chrome.mjs';
          const chrome = process.env.SENTINEL_E2E_CHROME;
          async function attempt(label) {
            try {
              const session = await launchChrome({ executablePath: chrome, headless: true, timeoutMs: 15_000 });
              console.log(`RUNTIME-SMOKE[${label}]: ALIVE pid=${session.pid}`);
              await session.close();
              console.log(`RUNTIME-SMOKE[${label}]: closed cleanly`);
            } catch (error) {
              console.log(`RUNTIME-SMOKE[${label}]: FAILED ${error.code}: ${error.message.slice(0, 300)}`);
            }
          }
          await attempt('standalone');
          // Same-process direct spawn: if this lives while launchChrome dies
          // in the SAME node process, the module import is not the factor.
          const { spawn } = await import('node:child_process');
          const { mkdtemp, mkdir } = await import('node:fs/promises');
          const { randomBytes } = await import('node:crypto');
          async function direct(label, profile) {
            for (const d of ['.config', '.cache', '.tmp', '.crash-dumps']) {
              await mkdir(`${profile}/${d}`, { mode: 0o700 });
            }
            const proc = spawn(chrome, ['--headless=new',
              '--remote-debugging-address=127.0.0.1', '--remote-debugging-port=0',
              `--user-data-dir=${profile}`, '--no-first-run', '--no-default-browser-check',
              '--disable-background-networking', '--disable-component-update',
              '--disable-default-apps', '--disable-extensions', '--disable-popup-blocking',
              '--disable-sync', '--disable-breakpad', '--disable-crash-reporter',
              '--noerrdialogs', `--crash-dumps-dir=${profile}/.crash-dumps`,
              '--metrics-recording-only', '--disable-dev-shm-usage', 'about:blank'], {
              detached: true,
              env: { HOME: profile, XDG_CONFIG_HOME: `${profile}/.config`,
                XDG_CACHE_HOME: `${profile}/.cache`, TMPDIR: `${profile}/.tmp`,
                LANG: 'C.UTF-8', LC_ALL: 'C.UTF-8', PATH: '/usr/bin:/bin' },
              stdio: ['ignore', 'ignore', 'pipe'],
            });
            let tail = '';
            proc.stderr.setEncoding('utf8');
            proc.stderr.on('data', (chunk) => { tail = `${tail}${chunk}`.slice(-300); });
            const verdict = await new Promise((resolve) => {
              const timer = setTimeout(() => resolve('ALIVE'), 6000);
              proc.once('exit', (code, signal) => { clearTimeout(timer); resolve(`DIED code=${code} signal=${signal} tail=${tail.trim().slice(-200)}`); });
            });
            console.log(`RUNTIME-SMOKE[${label}]: ${verdict}`);
            try { process.kill(-proc.pid, 'SIGKILL'); } catch { try { proc.kill('SIGKILL'); } catch {} }
          }
          await direct('sameproc-mkdtemp', await mkdtemp('/tmp/.chrome-sp-'));
          // Length ladder: find the profile-path length where Chrome traps.
          for (const hexLength of [8, 16, 20, 24, 32]) {
            const name = `/tmp/.chrome-profile-${process.pid}-${randomBytes(16).toString('hex').slice(0, hexLength)}`;
            await mkdir(name, { mode: 0o700 });
            await direct(`len-${String(name.length).padStart(3, '0')}       `, name);
          }
          // Same-length control with different content than the runtime pattern.
          const control = `/tmp/.chrome-${'x'.repeat(58 - '/tmp/.chrome-'.length)}`;
          await mkdir(control, { mode: 0o700 });
          await direct('ctrl-len-058     ', control);
          NODE

      - name: Node spawn-option bisect for the SIGTRAP
        env:
          SENTINEL_E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node --input-type=module - <<'NODE'
          import { spawn } from 'node:child_process';
          import { mkdtemp, mkdir, rm } from 'node:fs/promises';
          const chrome = process.env.SENTINEL_E2E_CHROME;
          async function probe(label, options) {
            const profile = await mkdtemp('/tmp/.chrome-bisect-');
            for (const d of ['.config', '.cache', '.tmp', '.crash-dumps']) {
              await mkdir(`${profile}/${d}`, { mode: 0o700 });
            }
            const minimalEnv = {
              HOME: profile, XDG_CONFIG_HOME: `${profile}/.config`,
              XDG_CACHE_HOME: `${profile}/.cache`, TMPDIR: `${profile}/.tmp`,
              LANG: 'C.UTF-8', LC_ALL: 'C.UTF-8', PATH: '/usr/bin:/bin',
            };
            const args = ['--headless=new', '--remote-debugging-address=127.0.0.1',
              '--remote-debugging-port=0', `--user-data-dir=${profile}`,
              '--no-first-run', '--no-default-browser-check',
              '--disable-background-networking', '--disable-component-update',
              '--disable-default-apps', '--disable-extensions',
              '--disable-popup-blocking', '--disable-sync', '--disable-breakpad',
              '--disable-crash-reporter', '--noerrdialogs',
              `--crash-dumps-dir=${profile}/.crash-dumps`,
              '--metrics-recording-only', '--disable-dev-shm-usage', 'about:blank'];
            const resolved = { detached: true, env: minimalEnv, stdio: ['ignore', 'ignore', 'pipe'], ...options };
            const child = spawn(chrome, args, resolved);
            const verdict = await new Promise((resolve) => {
              const timer = setTimeout(() => resolve('ALIVE'), 6000);
              child.once('exit', (code, signal) => { clearTimeout(timer); resolve(`DIED code=${code} signal=${signal}`); });
            });
            console.log(`BISECT[${label}]: ${verdict}`);
            try { process.kill(-child.pid, 'SIGKILL'); } catch { try { child.kill('SIGKILL'); } catch {} }
            await rm(profile, { recursive: true, force: true }).catch(() => {});
          }
          const { realpathSync } = await import('node:fs');
          console.log(`BISECT[path] given=${chrome}`);
          console.log(`BISECT[path] canonical=${realpathSync(chrome)}`);
          await probe('replica-symlink  ', {});
          const canonical = realpathSync(chrome);
          async function probeCanonical(label) {
            const original = chrome;
            // probe() closes over `chrome`; spawn the canonical path instead.
            const child = await import('node:child_process');
            const { mkdtemp: mkTemp, mkdir: mkDir, rm: rmDir } = await import('node:fs/promises');
            const profile = await mkTemp('/tmp/.chrome-canon-');
            for (const d of ['.config', '.cache', '.tmp', '.crash-dumps']) {
              await mkDir(`${profile}/${d}`, { mode: 0o700 });
            }
            const env = { HOME: profile, XDG_CONFIG_HOME: `${profile}/.config`,
              XDG_CACHE_HOME: `${profile}/.cache`, TMPDIR: `${profile}/.tmp`,
              LANG: 'C.UTF-8', LC_ALL: 'C.UTF-8', PATH: '/usr/bin:/bin' };
            const proc = child.spawn(canonical, ['--headless=new',
              '--remote-debugging-address=127.0.0.1', '--remote-debugging-port=0',
              `--user-data-dir=${profile}`, '--no-first-run', '--disable-dev-shm-usage',
              'about:blank'], { detached: true, env, stdio: ['ignore', 'ignore', 'pipe'] });
            const verdict = await new Promise((resolve) => {
              const timer = setTimeout(() => resolve('ALIVE'), 6000);
              proc.once('exit', (code, signal) => { clearTimeout(timer); resolve(`DIED code=${code} signal=${signal}`); });
            });
            console.log(`BISECT[${label}]: ${verdict}`);
            try { process.kill(-proc.pid, 'SIGKILL'); } catch { try { proc.kill('SIGKILL'); } catch {} }
            await rmDir(profile, { recursive: true, force: true }).catch(() => {});
          }
          await probeCanonical('canonical-path   ');
          NODE

      - name: Run complete test suite with mandatory Chrome
        env:
          SENTINEL_E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          unset SENTINEL_ALLOW_MISSING_CHROME_FOR_UNIT_TESTS
          npm test
          npm run lint
          npm run audit

      - name: Prove clean Git archive installation
        env:
          SENTINEL_E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: bash tests/e2e/clean-install.test.sh

      - name: Install exact Claude Code
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.214
          claude --version | grep -E '^2\.1\.214([[:space:]]|$)'

      - name: Prove isolated Claude and Codex installations
        run: bash tests/e2e/plugin-install.test.sh

      - name: Validate every JSON document
        run: |
          errors=0
          while IFS= read -r -d '' file; do
            if ! node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$file"; then
              echo "FAIL: $file"
              errors=$((errors + 1))
            fi
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)
          test "$errors" -eq 0

      - name: Validate frontmatter and mirror parity explicitly
        run: |
          bash tests/test-frontmatter.sh
          bash tests/test-mirror-parity.sh

      - name: Reject secret material and unexpected canary copies
        run: bash tests/test-secret-scan.sh
