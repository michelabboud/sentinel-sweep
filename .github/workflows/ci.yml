name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run the full integration test suite
      # Covers: structure, frontmatter, schema, mirror parity, version consistency
      - name: Run integration tests
        run: ./tests/run-all.sh

      # JSON validation (catches files outside tests/ scope)
      - name: Validate all JSON files
        run: |
          errors=0
          while IFS= read -r f; do
            if ! python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f" 2>/dev/null; then
              echo "FAIL: $f"
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.json' -not -path './.git/*' -not -path './tests/*')
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors JSON file(s) failed validation"
            exit 1
          fi
          echo "All JSON files valid."

      # YAML frontmatter validation
      - name: Validate YAML frontmatter
        run: |
          errors=0
          for dir in agents skills; do
            while IFS= read -r f; do
              if ! head -1 "$f" | grep -q '^---$'; then
                echo "FAIL: $f — missing opening ---"
                errors=$((errors + 1))
                continue
              fi
              close_line=$(awk 'NR>1 && /^---$/ { print NR; exit }' "$f")
              if [ -z "$close_line" ]; then
                echo "FAIL: $f — missing closing ---"
                errors=$((errors + 1))
                continue
              fi
              frontmatter=$(sed -n "2,$((close_line - 1))p" "$f")
              if ! echo "$frontmatter" | python3 -c "import yaml, sys; yaml.safe_load(sys.stdin)" 2>/dev/null; then
                echo "FAIL: $f — invalid YAML"
                errors=$((errors + 1))
              fi
            done < <(find "$dir" -name '*.md' -type f 2>/dev/null)
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors file(s) with invalid YAML frontmatter"
            exit 1
          fi
          echo "All frontmatter valid."
